# Desk — pf anchor. Rule 3: the daemon reaches exactly three hosts.
#
# Loaded into the anchor "com.thecompdesk.desk". See docs/EGRESS.md for
# installation, for the Little Snitch alternative, and for the verification
# that has to pass before this is considered installed.
#
# The table is filled from config/desk.toml by scripts/egress_table.sh so the
# Supabase host is never duplicated by hand in two places.

table <desk_egress> persist

# Default deny for the daemon's group. Order matters in pf: the LAST matching
# rule wins unless "quick" is used, so the block is stated first and the passes
# carry "quick".
block drop out proto { tcp, udp } group _desk

# DNS, to the resolver only. Without this the allowlisted hosts cannot resolve
# and the daemon looks broken rather than blocked.
pass out quick proto udp group _desk to any port 53
pass out quick proto tcp group _desk to any port 53

# The three hosts. HTTPS only.
pass out quick proto tcp group _desk to <desk_egress> port 443

# Loopback, for the local state files and nothing else.
pass out quick on lo0 group _desk

# Anything else from this group is dropped and logged. A daemon that suddenly
# wants a fourth host is the alarm — do not widen this file to silence it.
block drop log out proto { tcp, udp } group _desk
