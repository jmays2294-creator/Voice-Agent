[project]
name = "desk"
version = "0.1.0"
description = "Desk — an on-device voice front end for the Comp Desk operating system"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

# Floor deliberately small. Every addition needs a recorded reason in SUPPLY_CHAIN.md.
dependencies = [
  "claude-agent-sdk>=0.1.0",   # MIT
  "sounddevice>=0.4.6",        # MIT
  "numpy>=1.26",               # BSD-3
  "webrtcvad>=2.0.10",         # MIT
]

[project.optional-dependencies]
# Apple Silicon speech-in (GPU). Selected at runtime when darwin+arm64.
mlx = ["mlx-whisper>=0.4.0"]             # MIT
# Portable speech-in fallback (CPU).
fallback = ["faster-whisper>=1.0.0"]     # MIT
# macOS speech-out via AVSpeechSynthesizer. No model weights, no third party.
macos = ["pyobjc-framework-AVFoundation>=10.0", "pyobjc-framework-Quartz>=10.0"]
# Opt-in speech-out quality upgrade. See SUPPLY_CHAIN.md for the espeak-ng note.
kokoro = ["kokoro>=0.8.0"]               # Apache-2.0
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
desk = "desk.main:cli"
desk-action = "desk.actions_cli:main"
desk-guard = "desk.guard.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
